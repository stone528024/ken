<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR 特效修复版</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background: black;
        }

        /* --- 关键修复：强制层级关系 --- */
        /* MindAR 的视频层 */
        video {
            z-index: 1 !important;
        }

        /* A-Frame 的 AR 特效层 */
        .a-canvas {
            z-index: 2 !important;
            background-color: transparent !important;
        }

        /* UI 层 (最高层) */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* 顶部提示 */
        .hint-box {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            pointer-events: auto;
        }

        .hint-text {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* 调节大小的滑块 */
        .slider-container {
            pointer-events: auto;
            width: 80%;
            margin: 0 auto 10px auto;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            font-size: 12px;
        }

        input[type=range] {
            flex-grow: 1;
            margin: 0 10px;
        }

        /* 特效选择栏 */
        .effect-bar {
            pointer-events: auto;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            margin-bottom: 10px;
        }

        .effect-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            border: 3px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
        }

        .effect-btn.active {
            border-color: #00ff00;
            background: white;
            transform: scale(1.1);
        }

        /* 底部操作 */
        .action-bar {
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 30px;
        }

        #shutter {
            width: 70px;
            height: 70px;
            border: 4px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #shutter-inner {
            width: 55px;
            height: 55px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        #shutter.recording #shutter-inner {
            width: 25px;
            height: 25px;
            border-radius: 4px;
            background: red;
        }
    </style>
</head>

<body>

    <!-- AR 场景 -->
    <!-- alpha: true 保证背景透明，能看到摄像头 -->
    <a-scene mindar-face="imageTargetSrc: ; autoStart: true; facingMode: user" embedded
        renderer="colorManagement: true; physicallyCorrectLights: true; preserveDrawingBuffer: true; alpha: true"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-camera active="false" position="0 0 0"></a-camera>

        <a-assets>
            <a-asset-item id="glassesModel"
                src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.gltf"></a-asset-item>
        </a-assets>

        <!-- 1. 眼镜 (初始大小 0.01) -->
        <a-entity id="effect-glasses" mindar-face-target="anchorIndex: 168" visible="true">
            <a-gltf-model src="#glassesModel" position="0 -0.05 0" scale="0.01 0.01 0.01"
                rotation="0 0 0"></a-gltf-model>
        </a-entity>

        <!-- 2. 红鼻子 (初始大小 0.025) -->
        <a-entity id="effect-nose" mindar-face-target="anchorIndex: 1" visible="false">
            <a-sphere color="red" radius="1" position="0 0 0" scale="0.025 0.025 0.025"></a-sphere>
        </a-entity>

        <!-- 3. 帽子 (用圆锥体代替，初始大小 0.15) -->
        <a-entity id="effect-hat" mindar-face-target="anchorIndex: 10" visible="false">
            <a-cone color="#007bff" height="2" radius-bottom="1" position="0 0.5 -0.5" rotation="0 0 0"
                scale="0.15 0.15 0.15"></a-cone>
        </a-entity>

    </a-scene>


    <!-- UI 界面 -->
    <div id="ui-layer">
        <div class="hint-box"><span class="hint-text" id="status-msg">请将脸对准摄像头</span></div>

        <!-- 大小调节滑块 -->
        <div class="slider-container">
            <span>小</span>
            <input type="range" id="size-slider" min="0.5" max="2.0" step="0.1" value="1.0">
            <span>大</span>
        </div>

        <!-- 特效切换 -->
        <div class="effect-bar">
            <div class="effect-btn active" onclick="switchEffect('glasses', this)">👓</div>
            <div class="effect-btn" onclick="switchEffect('nose', this)">🔴</div>
            <div class="effect-btn" onclick="switchEffect('hat', this)">🎩</div>
        </div>

        <!-- 拍照按钮 -->
        <div class="action-bar">
            <div id="shutter">
                <div id="shutter-inner"></div>
            </div>
        </div>
    </div>


    <script>
        // === 1. 特效管理系统 ===
        let currentEffect = 'glasses';

        // 基础尺寸配置 (不同模型的缩放比例不一样)
        const baseScales = {
            glasses: 0.01,
            nose: 0.025,
            hat: 0.15
        };

        function switchEffect(type, btn) {
            // 1. UI 高亮
            document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // 2. 隐藏所有特效 (先全部设为 false)
            document.getElementById('effect-glasses').setAttribute('visible', false);
            document.getElementById('effect-nose').setAttribute('visible', false);
            document.getElementById('effect-hat').setAttribute('visible', false);

            // 3. 显示选中特效
            const target = document.getElementById('effect-' + type);
            if (target) {
                target.setAttribute('visible', true);
                currentEffect = type;

                // 重置滑块位置
                document.getElementById('size-slider').value = 1.0;
                updateScale(1.0);
            }
        }

        // === 2. 大小调节逻辑 (解决脸型不匹配) ===
        const slider = document.getElementById('size-slider');

        slider.addEventListener('input', (e) => {
            const multiplier = parseFloat(e.target.value);
            updateScale(multiplier);
        });

        function updateScale(multiplier) {
            // 找到当前特效内部的模型实体
            let entity = null;
            let base = 0;

            if (currentEffect === 'glasses') {
                entity = document.querySelector('#effect-glasses a-gltf-model');
                base = baseScales.glasses;
            } else if (currentEffect === 'nose') {
                entity = document.querySelector('#effect-nose a-sphere');
                base = baseScales.nose;
            } else if (currentEffect === 'hat') {
                entity = document.querySelector('#effect-hat a-cone');
                base = baseScales.hat;
            }

            if (entity) {
                // 计算新尺寸
                const newSize = base * multiplier;
                entity.setAttribute('scale', `${newSize} ${newSize} ${newSize}`);
            }
        }

        // === 3. 拍照/录制逻辑 ===
        const shutter = document.getElementById('shutter');
        const msg = document.getElementById('status-msg');
        let pressTimer, isRecording = false, mediaRecorder, recordedChunks = [], mergeInterval;

        shutter.addEventListener('touchstart', (e) => { e.preventDefault(); startPress(); });
        shutter.addEventListener('mousedown', (e) => { e.preventDefault(); startPress(); });
        shutter.addEventListener('touchend', (e) => { e.preventDefault(); endPress(); });
        shutter.addEventListener('mouseup', (e) => { e.preventDefault(); endPress(); });

        function startPress() { pressTimer = setTimeout(startRecording, 500); }
        function endPress() { clearTimeout(pressTimer); if (isRecording) stopRecording(); else takePhoto(); }

        function getMergedCanvas() {
            const video = document.querySelector('video');
            const arScene = document.querySelector('a-scene');
            if (!video || !arScene) return null;

            const width = video.videoWidth;
            const height = video.videoHeight;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // 绘制背景 (前置需镜像)
            ctx.save();
            ctx.translate(width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, width, height);
            ctx.restore();

            // 绘制特效
            const arCanvas = arScene.components.screenshot.getCanvas('perspective');
            if (arCanvas) ctx.drawImage(arCanvas, 0, 0, width, height);
            return canvas;
        }

        function takePhoto() {
            msg.innerText = "生成图片中...";
            const canvas = getMergedCanvas();
            if (canvas) {
                const link = document.createElement('a');
                link.download = 'ar-photo.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                msg.innerText = "图片已保存";
            }
        }

        function startRecording() {
            isRecording = true;
            shutter.classList.add('recording');
            msg.innerText = "录像中...";
            recordedChunks = [];

            const streamCanvas = document.createElement('canvas');
            const video = document.querySelector('video');
            streamCanvas.width = video.videoWidth;
            streamCanvas.height = video.videoHeight;
            const ctx = streamCanvas.getContext('2d');

            mergeInterval = setInterval(() => {
                const merged = getMergedCanvas();
                if (merged) ctx.drawImage(merged, 0, 0);
            }, 33);

            try {
                const stream = streamCanvas.captureStream(30);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    clearInterval(mergeInterval);
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'ar-video.webm';
                    a.click();
                    msg.innerText = "视频已保存";
                };
                mediaRecorder.start();
            } catch (e) {
                alert("录制失败，请使用系统录屏");
                stopRecording();
            }
        }

        function stopRecording() {
            isRecording = false;
            shutter.classList.remove('recording');
            if (mediaRecorder) mediaRecorder.stop();
        }
    </script>
</body>

</html>
