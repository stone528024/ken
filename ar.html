<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR 后置默认版</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background: #000;
        }

        /* UI 遮罩层 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* 顶部提示 */
        .top-hint {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: yellow;
            text-shadow: 1px 1px 2px black;
            font-size: 14px;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 0;
        }

        /* 特效按钮栏 */
        .effect-bar {
            pointer-events: auto;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .effect-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: white;
            border: 3px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .effect-btn.active {
            border-color: #00ff00;
            transform: scale(1.1);
        }

        /* 底部操作栏 */
        .action-bar {
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: linear-gradient(to top, black, transparent);
        }

        /* 按钮样式 */
        .btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
        }

        /* 拍照录像大按钮 */
        #shutter {
            width: 70px;
            height: 70px;
            border: 4px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #shutter-inner {
            width: 55px;
            height: 55px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        #shutter.recording #shutter-inner {
            width: 25px;
            height: 25px;
            border-radius: 4px;
            background: red;
        }
    </style>

    <script>
        // 在页面加载前，判断 URL 参数
        // 如果没有参数，我们就强制加上 facing=environment (后置)
        // 这样保证第一次打开就是后置
        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.has('facing')) {
                // 这里的 logic 是：如果没有参数，重定向到带 environment 参数的网址
                // 防止浏览器缓存前置配置
                const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?facing=environment';
                window.location.replace(newUrl);
            }
        })();
    </script>
</head>

<body>

    <!-- 
    核心修改：
    使用 JS 读取 URL 参数，如果没读到（极少情况）也默认 environment 
  -->
    <script>
        const params = new URLSearchParams(window.location.search);
        const facing = params.get('facing') || 'environment'; // 默认后置

        document.write(`
      <a-scene 
        mindar-face="imageTargetSrc: ; autoStart: true; facingMode: ${facing}"
        embedded
        renderer="colorManagement: true, physicallyCorrectLights; preserveDrawingBuffer: true"
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera active="false" position="0 0 0"></a-camera>

        <a-assets>
          <a-asset-item id="glassesModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.gltf"></a-asset-item>
        </a-assets>

        <!-- 特效1: 红鼻子 (默认开启，最容易测试) -->
        <a-entity id="el-nose" mindar-face-target="anchorIndex: 1" visible="true">
          <a-sphere color="red" radius="0.025"></a-sphere>
        </a-entity>

        <!-- 特效2: 眼镜 -->
        <a-entity id="el-glasses" mindar-face-target="anchorIndex: 168" visible="false">
          <a-gltf-model rotation="0 0 0" position="0 -0.05 0" scale="0.01 0.01 0.01" src="#glassesModel"></a-gltf-model>
        </a-entity>

      </a-scene>
    `);
    </script>

    <!-- UI 界面 -->
    <div id="ui-layer">
        <div class="top-hint" id="hint-msg">当前是【后置摄像头】请对着人脸或照片</div>

        <!-- 特效选择 -->
        <div class="effect-bar">
            <div class="effect-btn active" onclick="setEffect('nose', this)">🔴</div>
            <div class="effect-btn" onclick="setEffect('glasses', this)">👓</div>
            <div class="effect-btn" onclick="setEffect('none', this)">🚫</div>
        </div>

        <!-- 底部按钮 -->
        <div class="action-bar">
            <button class="btn" id="switch-btn">切回前置</button>
            <div id="shutter">
                <div id="shutter-inner"></div>
            </div>
            <button class="btn" onclick="alert('长按中间按钮录制，松开保存')">帮助</button>
        </div>
    </div>

    <script>
        // --- 1. 摄像头切换逻辑 ---
        const switchBtn = document.getElementById('switch-btn');
        const currentFacing = new URLSearchParams(window.location.search).get('facing') || 'environment';

        // 更新按钮文字和提示
        if (currentFacing === 'user') {
            switchBtn.innerText = "切回后置";
            document.getElementById('hint-msg').innerText = "当前是【前置摄像头】自拍模式";
        } else {
            switchBtn.innerText = "切回前置";
            document.getElementById('hint-msg').innerText = "当前是【后置摄像头】请找个人脸扫一下";
        }

        switchBtn.addEventListener('click', () => {
            const newMode = currentFacing === 'user' ? 'environment' : 'user';
            window.location.search = `?facing=${newMode}`;
        });

        // --- 2. 特效切换逻辑 ---
        window.setEffect = function (type, btn) {
            document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const nose = document.querySelector('#el-nose');
            const glasses = document.querySelector('#el-glasses');

            if (nose) nose.setAttribute('visible', false);
            if (glasses) glasses.setAttribute('visible', false);

            if (type === 'nose' && nose) nose.setAttribute('visible', true);
            if (type === 'glasses' && glasses) glasses.setAttribute('visible', true);
        }

        // --- 3. 录像逻辑 (合并画面) ---
        const shutter = document.getElementById('shutter');
        const hintMsg = document.getElementById('hint-msg');
        let pressTimer, isRecording = false, mediaRecorder, recordedChunks = [], mergeInterval;

        shutter.addEventListener('touchstart', (e) => { e.preventDefault(); startPress(); });
        shutter.addEventListener('mousedown', (e) => { e.preventDefault(); startPress(); });
        shutter.addEventListener('touchend', (e) => { e.preventDefault(); endPress(); });
        shutter.addEventListener('mouseup', (e) => { e.preventDefault(); endPress(); });

        function startPress() {
            pressTimer = setTimeout(startRecording, 500);
        }

        function endPress() {
            clearTimeout(pressTimer);
            if (isRecording) stopRecording();
            else takePhoto();
        }

        function getMergedCanvas() {
            const video = document.querySelector('video');
            const arScene = document.querySelector('a-scene');
            if (!video || !arScene) return null;

            const width = video.videoWidth;
            const height = video.videoHeight;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            ctx.save();
            // 如果是前置才需要镜像，后置不需要
            if (currentFacing === 'user') {
                ctx.translate(width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, width, height);
            ctx.restore();

            const arCanvas = arScene.components.screenshot.getCanvas('perspective');
            if (arCanvas) ctx.drawImage(arCanvas, 0, 0, width, height);
            return canvas;
        }

        function takePhoto() {
            hintMsg.innerText = "生成图片中...";
            const canvas = getMergedCanvas();
            if (canvas) {
                const link = document.createElement('a');
                link.download = 'ar-photo.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                hintMsg.innerText = "图片已保存";
            }
        }

        function startRecording() {
            isRecording = true;
            shutter.classList.add('recording');
            hintMsg.innerText = "录制中...";
            recordedChunks = [];

            const streamCanvas = document.createElement('canvas');
            const video = document.querySelector('video');
            streamCanvas.width = video.videoWidth;
            streamCanvas.height = video.videoHeight;
            const ctx = streamCanvas.getContext('2d');

            mergeInterval = setInterval(() => {
                const merged = getMergedCanvas();
                if (merged) ctx.drawImage(merged, 0, 0);
            }, 33);

            const stream = streamCanvas.captureStream(30);
            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    clearInterval(mergeInterval);
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'ar-video.webm';
                    a.click();
                    hintMsg.innerText = "视频已保存";
                };
                mediaRecorder.start();
            } catch (e) {
                alert("不支持录制，请用系统录屏");
                stopRecording();
            }
        }

        function stopRecording() {
            isRecording = false;
            shutter.classList.remove('recording');
            if (mediaRecorder) mediaRecorder.stop();
        }
    </script>
</body>

</html>
