<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR 超级相机</title>
    <!-- A-Frame 和 MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* --- UI 布局 --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* 顶部提示 */
        .status-bar {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 12px;
            text-shadow: 1px 1px 2px black;
        }

        /* 特效选择栏 */
        .effect-scroller {
            pointer-events: auto;
            display: flex;
            gap: 10px;
            padding: 10px;
            overflow-x: auto;
            background: rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .effect-btn {
            min-width: 60px;
            height: 60px;
            border-radius: 10px;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #333;
            cursor: pointer;
        }

        .effect-btn.active {
            border-color: #00ff00;
            background: white;
        }

        .effect-btn img {
            width: 30px;
            height: 30px;
            margin-bottom: 2px;
        }

        /* 底部控制栏 */
        .control-bar {
            pointer-events: auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 30px;
            padding-top: 10px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
        }

        /* 拍照/录制按钮 */
        #shutter-btn {
            width: 70px;
            height: 70px;
            border: 4px solid white;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #shutter-inner {
            width: 55px;
            height: 55px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        #shutter-btn.recording #shutter-inner {
            width: 25px;
            height: 25px;
            border-radius: 4px;
            background: red;
        }

        /* 普通功能按钮 */
        .func-btn {
            color: white;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        /* 隐藏的 Canvas 用于录制合成 */
        #merge-canvas {
            display: none;
        }
    </style>

    <script>
        // 在 A-Frame 加载前处理 URL 参数，动态设置场景配置
        // 这是解决“无法切换后置”最关键的一步
        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const facing = urlParams.get('facing') || 'user'; // user=前置, environment=后置

            const scene = document.querySelector('a-scene');
            // 强制写入 mindar-face 配置
            scene.setAttribute('mindar-face', `imageTargetSrc: ; autoStart: true; facingMode: ${facing}`);

            // 更新按钮文字
            const switchBtn = document.getElementById('switch-cam');
            switchBtn.innerText = facing === 'user' ? '切到后置' : '切到前置';
        });
    </script>
</head>

<body>
    <!-- 
    renderer="preserveDrawingBuffer: true" 必须开启，否则录制黑屏 
  -->
    <a-scene embedded renderer="colorManagement: true, physicallyCorrectLights; preserveDrawingBuffer: true"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <!-- 资源管理 -->
        <a-assets>
            <a-asset-item id="glassesModel"
                src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.gltf"></a-asset-item>
            <a-asset-item id="hatModel"
                src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/hat/scene.gltf"></a-asset-item>
        </a-assets>

        <a-camera active="false" position="0 0 0"></a-camera>

        <!-- 特效 1: 眼镜 (锚点 168 鼻梁) -->
        <a-entity id="effect-glasses" mindar-face-target="anchorIndex: 168" visible="true">
            <a-gltf-model rotation="0 0 0" position="0 -0.05 0" scale="0.01 0.01 0.01"
                src="#glassesModel"></a-gltf-model>
        </a-entity>

        <!-- 特效 2: 小丑红鼻子 (锚点 1 鼻尖) -->
        <a-entity id="effect-nose" mindar-face-target="anchorIndex: 1" visible="false">
            <!-- 直接用红色球体代替模型，加载更快 -->
            <a-sphere color="red" radius="0.02" position="0 0 0"></a-sphere>
        </a-entity>

        <!-- 特效 3: 帽子 (锚点 10 头顶) -->
        <a-entity id="effect-hat" mindar-face-target="anchorIndex: 10" visible="false">
            <a-gltf-model rotation="0 0 0" position="0 -0.2 -0.5" scale="0.008 0.008 0.008"
                src="#hatModel"></a-gltf-model>
        </a-entity>

    </a-scene>

    <!-- UI 界面 -->
    <div class="ui-layer">
        <div class="status-bar" id="status-text">长按白色按钮录制</div>

        <!-- 特效选择 -->
        <div class="effect-scroller">
            <div class="effect-btn active" onclick="switchEffect('glasses', this)">
                <span>👓</span>眼镜
            </div>
            <div class="effect-btn" onclick="switchEffect('nose', this)">
                <span>🔴</span>红鼻子
            </div>
            <div class="effect-btn" onclick="switchEffect('hat', this)">
                <span>🎩</span>帽子
            </div>
            <div class="effect-btn" onclick="switchEffect('none', this)">
                <span>🚫</span>无
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="control-bar">
            <button id="switch-cam" class="func-btn">切换</button>

            <div id="shutter-btn">
                <div id="shutter-inner"></div>
            </div>

            <!-- 这里只是占位，为了布局平衡 -->
            <button class="func-btn" style="opacity:0">设置</button>
        </div>
    </div>

    <script>
        // --- 1. 特效切换逻辑 ---
        function switchEffect(name, btnElement) {
            // 更新 UI 高亮
            document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            // 隐藏所有特效
            document.getElementById('effect-glasses').setAttribute('visible', false);
            document.getElementById('effect-nose').setAttribute('visible', false);
            document.getElementById('effect-hat').setAttribute('visible', false);

            // 显示选中的特效
            if (name !== 'none') {
                const target = document.getElementById('effect-' + name);
                if (target) target.setAttribute('visible', true);
            }
        }

        // --- 2. 摄像头切换逻辑 ---
        document.getElementById('switch-cam').addEventListener('click', () => {
            const currentParams = new URLSearchParams(window.location.search);
            const currentFacing = currentParams.get('facing') || 'user';
            const newFacing = currentFacing === 'user' ? 'environment' : 'user';

            // 必须重新加载页面才能彻底切换底层 Camera 流
            window.location.search = `?facing=${newFacing}`;
        });


        // --- 3. 录制与拍照核心逻辑 ---
        const shutterBtn = document.getElementById('shutter-btn');
        const statusText = document.getElementById('status-text');
        let pressTimer;
        let isRecording = false;
        let mediaRecorder;
        let recordedChunks = [];
        let mergeInterval;

        // 触摸开始
        shutterBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            pressTimer = setTimeout(startRecording, 500); // 长按 500ms 触发录像
        });
        shutterBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            pressTimer = setTimeout(startRecording, 500);
        });

        // 触摸结束
        shutterBtn.addEventListener('touchend', endPress);
        shutterBtn.addEventListener('mouseup', endPress);

        function endPress() {
            clearTimeout(pressTimer);
            if (isRecording) {
                stopRecording();
            } else {
                takePhoto(); // 如果没触发长按，就拍照
            }
        }

        // --- 工具：获取合并后的 Canvas (视频+AR) ---
        function getMergedCanvas() {
            const video = document.querySelector('video'); // 摄像头画面
            const arCanvas = document.querySelector('a-scene').components.screenshot.getCanvas('perspective'); // AR 画面

            if (!video || !arCanvas) return null;

            const width = video.videoWidth;
            const height = video.videoHeight;

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // 1. 画视频 (处理镜像)
            ctx.save();
            const urlParams = new URLSearchParams(window.location.search);
            const isUser = (urlParams.get('facing') || 'user') === 'user';
            if (isUser) {
                ctx.translate(width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, width, height);
            ctx.restore();

            // 2. 画 AR 模型
            ctx.drawImage(arCanvas, 0, 0, width, height);

            return canvas;
        }

        // --- 拍照 ---
        function takePhoto() {
            statusText.innerText = "正在处理图片...";
            const canvas = getMergedCanvas();
            if (canvas) {
                const link = document.createElement('a');
                link.download = `ar-photo-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                statusText.innerText = "图片已保存";
                setTimeout(() => statusText.innerText = "长按白色按钮录制", 2000);
            }
        }

        // --- 录像 (难点) ---
        function startRecording() {
            console.log("开始录制");
            isRecording = true;
            shutterBtn.classList.add('recording');
            statusText.innerText = "录制中...";
            recordedChunks = [];

            // 创建一个离屏 Canvas 用于持续绘制
            const video = document.querySelector('video');
            const streamCanvas = document.createElement('canvas');
            streamCanvas.width = video.videoWidth;
            streamCanvas.height = video.videoHeight;
            const ctx = streamCanvas.getContext('2d');

            // 开启循环绘制 (30FPS)
            mergeInterval = setInterval(() => {
                const merged = getMergedCanvas();
                if (merged) {
                    ctx.drawImage(merged, 0, 0);
                }
            }, 1000 / 30);

            // 从 Canvas 获取流
            const stream = streamCanvas.captureStream(30);

            try {
                // 尝试支持的格式
                const options = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
                    ? { mimeType: 'video/webm;codecs=vp9' }
                    : { mimeType: 'video/webm' };

                mediaRecorder = new MediaRecorder(stream, options);

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    clearInterval(mergeInterval);
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `ar-video-${Date.now()}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    statusText.innerText = "视频已保存";
                };

                mediaRecorder.start();
            } catch (e) {
                alert("当前浏览器不支持录制，请使用安卓 Chrome 或 PC。iOS 请使用系统自带录屏。");
                stopRecording();
            }
        }

        function stopRecording() {
            isRecording = false;
            shutterBtn.classList.remove('recording');
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

    </script>
</body>

</html>
