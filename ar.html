<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>H5 人脸 AR 特效</title>
    <!-- 1. 引入 A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- 2. 引入 MindAR Face 版本 (注意这里是 face-aframe) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
</head>

<body>
    <!-- 
      MindAR 场景配置：
      mindar-face: 开启人脸模式
    -->
    <a-scene mindar-face device-orientation-permission-ui="enabled: false" vr-mode-ui="enabled: false">

        <!-- 摄像头配置 (active="false" 是因为 MindAR 会接管摄像头) -->
        <a-camera active="false" position="0 0 0"></a-camera>

        <!-- 资源：预加载眼镜模型 -->
        <a-assets>
            <!-- 这是官方的一个眼镜模型 -->
            <a-asset-item id="glassesModel"
                src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.gltf"></a-asset-item>
        </a-assets>

        <!-- 
        人脸追踪实体 
        mindar-face-target="anchorIndex: 168"
        anchorIndex 是锚点：
        168 = 眉心/两眼之间 (适合放眼镜、帽子)
        1   = 鼻尖 (适合放小丑红鼻子)
        10  = 嘴巴
      -->
        <a-entity mindar-face-target="anchorIndex: 168">

            <!-- 放置 3D 模型 -->
            <!-- position/rotation/scale 需要根据模型自己微调 -->
            <a-gltf-model rotation="0 0 0" position="0 -0.05 0" scale="0.01 0.01 0.01" src="#glassesModel">
            </a-gltf-model>

        </a-entity>

    </a-scene>
</body>

</html>
