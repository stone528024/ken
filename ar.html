<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR 特效相机 (iOS修复版)</title>

    <!-- 1. 引入库文件 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background: #000;
        }

        /* UI 遮罩层 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* 顶部提示 */
        .status-bar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 10px 0;
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            font-size: 14px;
            pointer-events: auto;
        }

        /* 特效选择栏 */
        .effect-bar {
            pointer-events: auto;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .effect-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: white;
            border: 3px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            font-size: 10px;
            color: #333;
        }

        .effect-btn span {
            font-size: 20px;
            display: block;
            margin-bottom: 2px;
        }

        .effect-btn.active {
            border-color: #00ff00;
            transform: scale(1.1);
            background: #fff;
        }

        /* 底部操作栏 */
        .action-bar {
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: linear-gradient(to top, black, transparent);
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        /* 快门按钮 */
        #shutter {
            width: 70px;
            height: 70px;
            border: 4px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #shutter-inner {
            width: 55px;
            height: 55px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        #shutter.recording #shutter-inner {
            width: 25px;
            height: 25px;
            border-radius: 4px;
            background: red;
        }
    </style>
</head>

<body>

    <!-- AR 场景 -->
    <!-- 注意：初始 facingMode 设为 user (前置)，保证 iOS 第一次能稳定启动 -->
    <!-- 我们稍后用按钮切换到后置 -->
    <a-scene mindar-face="imageTargetSrc: ; autoStart: true; facingMode: user" embedded
        renderer="colorManagement: true, physicallyCorrectLights; preserveDrawingBuffer: true"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-camera active="false" position="0 0 0"></a-camera>

        <!-- 资源 -->
        <a-assets>
            <a-asset-item id="glassesModel"
                src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.gltf"></a-asset-item>
        </a-assets>

        <!-- 特效1: 红鼻子 (Anchor 1 = 鼻尖) -->
        <a-entity id="el-nose" mindar-face-target="anchorIndex: 1" visible="false">
            <a-sphere color="red" radius="0.025"></a-sphere>
        </a-entity>

        <!-- 特效2: 眼镜 (Anchor 168 = 眉心) -->
        <a-entity id="el-glasses" mindar-face-target="anchorIndex: 168" visible="true">
            <a-gltf-model rotation="0 0 0" position="0 -0.05 0" scale="0.01 0.01 0.01"
                src="#glassesModel"></a-gltf-model>
        </a-entity>

        <!-- 特效3: 帽子 (Anchor 10 = 头顶) -->
        <a-entity id="el-hat" mindar-face-target="anchorIndex: 10" visible="false">
            <!-- 这里用一个简单的蓝色圆锥体代替帽子模型，确保能显示 -->
            <a-cone color="blue" radius-bottom="0.1" height="0.2" position="0 0.1 0"></a-cone>
        </a-entity>

    </a-scene>


    <!-- UI 界面 -->
    <div id="ui-layer">
        <div class="status-bar" id="msg">点击“切换”使用后置摄像头</div>

        <!-- 特效选择 -->
        <div class="effect-bar">
            <div class="effect-btn active" onclick="setEffect('glasses', this)">
                <span>👓</span>眼镜
            </div>
            <div class="effect-btn" onclick="setEffect('nose', this)">
                <span>🔴</span>鼻子
            </div>
            <div class="effect-btn" onclick="setEffect('hat', this)">
                <span>🎩</span>帽子
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="action-bar">
            <button class="btn" id="switch-btn">🔄 切换</button>
            <div id="shutter">
                <div id="shutter-inner"></div>
            </div>
            <button class="btn" onclick="alert('iOS用户如果录制失败，请使用系统自带的屏幕录制功能。')">❓ 帮助</button>
        </div>
    </div>


    <script>
        // === 1. iOS 摄像头切换核心修复 ===
        // 我们不再刷新页面，而是调用 AR 引擎的方法
        const switchBtn = document.getElementById('switch-btn');
        const msg = document.getElementById('msg');
        let isFrontCamera = true; // 初始状态

        switchBtn.addEventListener('click', () => {
            const scene = document.querySelector('a-scene');
            // 获取 MindAR 系统实例
            const mindArSystem = scene.systems['mindar-face-system'];

            if (mindArSystem) {
                msg.innerText = "正在切换摄像头...";
                // 调用引擎内部切换方法
                mindArSystem.switchCamera();

                isFrontCamera = !isFrontCamera;
                msg.innerText = isFrontCamera ? "当前：前置 (自拍)" : "当前：后置 (请对准人脸)";
            } else {
                alert("AR 引擎尚未加载完成，请稍后再试");
            }
        });

        // === 2. 特效切换逻辑 ===
        window.setEffect = function (type, btn) {
            // 样式更新
            document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // 隐藏所有
            document.getElementById('el-nose').setAttribute('visible', false);
            document.getElementById('el-glasses').setAttribute('visible', false);
            document.getElementById('el-hat').setAttribute('visible', false);

            // 显示选中
            if (type === 'nose') document.getElementById('el-nose').setAttribute('visible', true);
            if (type === 'glasses') document.getElementById('el-glasses').setAttribute('visible', true);
            if (type === 'hat') document.getElementById('el-hat').setAttribute('visible', true);
        }

        // === 3. 录像/拍照逻辑 ===
        const shutter = document.getElementById('shutter');
        let pressTimer, isRecording = false, mediaRecorder, recordedChunks = [], mergeInterval;

        shutter.addEventListener('touchstart', (e) => { e.preventDefault(); startPress(); });
        shutter.addEventListener('mousedown', (e) => { e.preventDefault(); startPress(); });
        shutter.addEventListener('touchend', (e) => { e.preventDefault(); endPress(); });
        shutter.addEventListener('mouseup', (e) => { e.preventDefault(); endPress(); });

        function startPress() {
            pressTimer = setTimeout(startRecording, 500); // 长按 0.5秒
        }

        function endPress() {
            clearTimeout(pressTimer);
            if (isRecording) stopRecording();
            else takePhoto();
        }

        // 获取合成画面 (Video + AR)
        function getMergedCanvas() {
            const video = document.querySelector('video');
            const arScene = document.querySelector('a-scene');
            if (!video || !arScene) return null;

            const width = video.videoWidth;
            const height = video.videoHeight;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // 绘制背景
            ctx.save();
            // 只有前置摄像头需要镜像，后置不需要
            // MindAR 的 activeFacingMode 可以判断当前是哪种
            if (isFrontCamera) {
                ctx.translate(width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, width, height);
            ctx.restore();

            // 绘制特效
            const arCanvas = arScene.components.screenshot.getCanvas('perspective');
            if (arCanvas) ctx.drawImage(arCanvas, 0, 0, width, height);
            return canvas;
        }

        function takePhoto() {
            msg.innerText = "生成图片...";
            const canvas = getMergedCanvas();
            if (canvas) {
                const link = document.createElement('a');
                link.download = `ar-photo-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                msg.innerText = "图片已保存";
            }
        }

        function startRecording() {
            isRecording = true;
            shutter.classList.add('recording');
            msg.innerText = "录制中...";
            recordedChunks = [];

            const streamCanvas = document.createElement('canvas');
            const video = document.querySelector('video');
            // 防止未初始化
            if (!video) { stopRecording(); return; }

            streamCanvas.width = video.videoWidth;
            streamCanvas.height = video.videoHeight;
            const ctx = streamCanvas.getContext('2d');

            // 循环绘制
            mergeInterval = setInterval(() => {
                const merged = getMergedCanvas();
                if (merged) ctx.drawImage(merged, 0, 0);
            }, 33); // ~30 FPS

            const stream = streamCanvas.captureStream(30);

            try {
                // iOS 兼容性尝试
                let mimeType = 'video/webm';
                if (MediaRecorder.isTypeSupported('video/mp4')) mimeType = 'video/mp4';

                mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    clearInterval(mergeInterval);
                    const blob = new Blob(recordedChunks, { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `ar-video-${Date.now()}.${mimeType === 'video/mp4' ? 'mp4' : 'webm'}`;
                    a.click();
                    msg.innerText = "视频已保存";
                };
                mediaRecorder.start();
            } catch (e) {
                console.error(e);
                alert("录制启动失败：iOS Safari 对网页录像限制严格，请使用系统自带的屏幕录制功能。");
                stopRecording();
            }
        }

        function stopRecording() {
            isRecording = false;
            shutter.classList.remove('recording');
            if (mediaRecorder) mediaRecorder.stop();
        }
    </script>
</body>

</html>
