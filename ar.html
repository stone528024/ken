<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR 完美修复版</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background: #000;
        }

        /* UI 层，必须设置 z-index 保证在最上层 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* 顶部提示 */
        .top-bar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 10px;
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            font-size: 12px;
            pointer-events: auto;
        }

        /* 特效选择栏 */
        .effect-bar {
            pointer-events: auto;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            overflow-x: auto;
        }

        .effect-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: white;
            border: 3px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .effect-btn.active {
            border-color: #00ff00;
            transform: scale(1.1);
        }

        /* 底部操作栏 */
        .action-bar {
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: linear-gradient(to top, black, transparent);
        }

        /* 按钮样式 */
        .btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(5px);
        }

        /* 拍照/录像主按钮 */
        #shutter {
            width: 70px;
            height: 70px;
            border: 4px solid white;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #shutter-inner {
            width: 55px;
            height: 55px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        #shutter.recording #shutter-inner {
            width: 25px;
            height: 25px;
            border-radius: 4px;
            background: red;
        }
    </style>
</head>

<body>

    <!-- 1. AR 容器：这里是空的，我们会用 JS 动态注入代码 -->
    <div id="ar-container"></div>

    <!-- 2. UI 界面 -->
    <div id="ui-layer">
        <div class="top-bar" id="status-msg">
            初始化中... (请确保使用 HTTPS)
        </div>

        <!-- 特效选择 -->
        <div class="effect-bar">
            <div class="effect-btn active" onclick="setEffect('glasses', this)">👓</div>
            <div class="effect-btn" onclick="setEffect('nose', this)">🔴</div>
            <div class="effect-btn" onclick="setEffect('hat', this)">🎩</div>
            <div class="effect-btn" onclick="setEffect('none', this)">🚫</div>
        </div>

        <!-- 底部按钮 -->
        <div class="action-bar">
            <button class="btn" id="switch-btn">切换摄像头</button>
            <div id="shutter">
                <div id="shutter-inner"></div>
            </div>
            <button class="btn" onclick="alert('iOS用户请使用系统自带录屏')">帮助</button>
        </div>
    </div>

    <script>
        // === 第一步：动态构建 AR 场景 (解决摄像头无法切换的核心) ===

        // 1. 获取 URL 里的参数，默认是 'user' (前置)
        const urlParams = new URLSearchParams(window.location.search);
        const facingMode = urlParams.get('facing') || 'user';

        // 2. 更新按钮文字
        const switchBtn = document.getElementById('switch-btn');
        switchBtn.innerText = facingMode === 'user' ? '切到后置' : '切到前置';

        // 3. 构建 HTML 字符串
        // 注意 mindar-face="facingMode: ${facingMode}" 这一段
        const sceneHTML = `
      <a-scene 
        mindar-face="imageTargetSrc: ; autoStart: true; facingMode: ${facingMode}"
        embedded
        renderer="colorManagement: true, physicallyCorrectLights; preserveDrawingBuffer: true"
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera active="false" position="0 0 0"></a-camera>

        <a-assets>
          <a-asset-item id="glassesModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.gltf"></a-asset-item>
          <a-asset-item id="hatModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/hat/scene.gltf"></a-asset-item>
        </a-assets>

        <!-- 特效1: 眼镜 (默认显示) -->
        <a-entity id="el-glasses" mindar-face-target="anchorIndex: 168" visible="true">
          <a-gltf-model rotation="0 0 0" position="0 -0.05 0" scale="0.01 0.01 0.01" src="#glassesModel"></a-gltf-model>
        </a-entity>

        <!-- 特效2: 红鼻子 (纯代码几何体，保证加载成功) -->
        <a-entity id="el-nose" mindar-face-target="anchorIndex: 1" visible="false">
          <a-sphere color="red" radius="0.025" position="0 0 0"></a-sphere>
        </a-entity>

        <!-- 特效3: 帽子 -->
        <a-entity id="el-hat" mindar-face-target="anchorIndex: 10" visible="false">
          <a-gltf-model rotation="0 0 0" position="0 -0.2 -0.5" scale="0.008 0.008 0.008" src="#hatModel"></a-gltf-model>
        </a-entity>

      </a-scene>
    `;

        // 4. 注入到页面中
        document.getElementById('ar-container').innerHTML = sceneHTML;
        document.getElementById('status-msg').innerText = "加载完毕，请扫描人脸";

        // === 第二步：功能逻辑 ===

        // 1. 切换摄像头
        switchBtn.addEventListener('click', function () {
            // 必须刷新页面，否则 WebGL 上下文不会释放
            const newMode = facingMode === 'user' ? 'environment' : 'user';
            window.location.search = '?facing=' + newMode;
        });

        // 2. 切换特效
        window.setEffect = function (type, btn) {
            // UI 更新
            document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // 逻辑更新 (先全部隐藏)
            const glasses = document.querySelector('#el-glasses');
            const nose = document.querySelector('#el-nose');
            const hat = document.querySelector('#el-hat');

            // 注意：A-Frame 加载需要时间，可能 element 还没生成，加个判断
            if (glasses) glasses.setAttribute('visible', false);
            if (nose) nose.setAttribute('visible', false);
            if (hat) hat.setAttribute('visible', false);

            // 显示选中的
            if (type === 'glasses' && glasses) glasses.setAttribute('visible', true);
            if (type === 'nose' && nose) nose.setAttribute('visible', true);
            if (type === 'hat' && hat) hat.setAttribute('visible', true);
        }

        // 3. 拍照/录制逻辑
        const shutter = document.getElementById('shutter');
        let pressTimer;
        let isRecording = false;
        let mediaRecorder;
        let recordedChunks = [];
        let mergeInterval;

        // 触摸开始
        shutter.addEventListener('touchstart', (e) => { e.preventDefault(); startPress(); });
        shutter.addEventListener('mousedown', (e) => { e.preventDefault(); startPress(); });

        // 触摸结束
        shutter.addEventListener('touchend', (e) => { e.preventDefault(); endPress(); });
        shutter.addEventListener('mouseup', (e) => { e.preventDefault(); endPress(); });

        function startPress() {
            pressTimer = setTimeout(() => {
                startRecording();
            }, 500); // 0.5秒后开始录制
        }

        function endPress() {
            clearTimeout(pressTimer);
            if (isRecording) {
                stopRecording();
            } else {
                takePhoto();
            }
        }

        // 核心工具：合并 Video 和 3D Canvas
        function getMergedCanvas() {
            const video = document.querySelector('video');
            const arScene = document.querySelector('a-scene');

            if (!video || !arScene) return null;

            // 获取 A-Frame 的 Canvas
            const arCanvas = arScene.components.screenshot.getCanvas('perspective');

            const width = video.videoWidth;
            const height = video.videoHeight;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // 绘制摄像头背景 (根据是否是前置进行镜像翻转)
            ctx.save();
            if (facingMode === 'user') {
                ctx.translate(width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, width, height);
            ctx.restore();

            // 绘制 AR 特效
            if (arCanvas) {
                ctx.drawImage(arCanvas, 0, 0, width, height);
            }
            return canvas;
        }

        function takePhoto() {
            document.getElementById('status-msg').innerText = "正在处理照片...";
            const canvas = getMergedCanvas();
            if (canvas) {
                const link = document.createElement('a');
                link.download = 'ar-photo-' + Date.now() + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                document.getElementById('status-msg').innerText = "照片已保存";
            }
        }

        function startRecording() {
            console.log("尝试录制...");
            isRecording = true;
            shutter.classList.add('recording');
            document.getElementById('status-msg').innerText = "录制中...";

            recordedChunks = [];
            const streamCanvas = document.createElement('canvas');
            const video = document.querySelector('video');
            streamCanvas.width = video.videoWidth;
            streamCanvas.height = video.videoHeight;
            const ctx = streamCanvas.getContext('2d');

            // 30帧循环绘制
            mergeInterval = setInterval(() => {
                const merged = getMergedCanvas();
                if (merged) ctx.drawImage(merged, 0, 0);
            }, 33);

            const stream = streamCanvas.captureStream(30);

            // 兼容性判断
            let options = { mimeType: 'video/webm' };
            if (MediaRecorder.isTypeSupported('video/mp4')) {
                options = { mimeType: 'video/mp4' };
            }

            try {
                mediaRecorder = new MediaRecorder(stream, options);
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                mediaRecorder.onstop = () => {
                    clearInterval(mergeInterval);
                    const blob = new Blob(recordedChunks, { type: options.mimeType });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'ar-video-' + Date.now() + (options.mimeType.includes('mp4') ? '.mp4' : '.webm');
                    a.click();
                    document.getElementById('status-msg').innerText = "视频已保存";
                };
                mediaRecorder.start();
            } catch (e) {
                alert("您的浏览器不支持网页录屏，请使用系统录屏功能。");
                stopRecording();
            }
        }

        function stopRecording() {
            isRecording = false;
            shutter.classList.remove('recording');
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }
    </script>
</body>

</html>
