<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快乐8 模拟系统 - 选号与机选复制</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 动画与交互样式 */
        .ball {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ball:active {
            transform: scale(0.9);
        }

        .ball.selected {
            background-color: #ef4444;
            color: white;
            border-color: #ef4444;
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.3);
            animation: pop 0.3s ease-out;
        }

        .ball.banker {
            background-color: #10b981;
            color: white;
            border-color: #10b981;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3);
            animation: pop 0.3s ease-out;
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.25);
            }

            100% {
                transform: scale(1);
            }
        }

        .fade-in {
            animation: fadeIn 0.4s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Toast 提示框动画 */
        .toast-enter {
            animation: toastSlideDown 0.3s ease forwards;
        }

        .toast-leave {
            animation: toastSlideUp 0.3s ease forwards;
        }

        @keyframes toastSlideDown {
            from {
                transform: translate(-50%, -100%);
                opacity: 0;
            }

            to {
                transform: translate(-50%, 20px);
                opacity: 1;
            }
        }

        @keyframes toastSlideUp {
            from {
                transform: translate(-50%, 20px);
                opacity: 1;
            }

            to {
                transform: translate(-50%, -100%);
                opacity: 0;
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-800 font-sans pb-24 lg:pb-8">

    <!-- 全局 Toast 提示 -->
    <div id="toast"
        class="fixed top-0 left-1/2 -translate-x-1/2 -translate-y-full opacity-0 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-[100] flex items-center gap-2 transition-all">
        <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span id="toastMsg" class="text-sm font-medium">复制成功</span>
    </div>

    <!-- 顶部导航 -->
    <header class="bg-gradient-to-r from-red-600 to-red-500 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider">快乐8 模拟系统</h1>
            <div class="flex items-center gap-2">
                <span class="text-sm bg-red-700/50 px-3 py-1 rounded-full border border-red-400">玩法：</span>
                <select id="playType"
                    class="bg-white text-red-600 font-bold border-0 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-white">
                    <option value="10" selected>选十</option>
                    <option value="9">选九</option>
                    <option value="8">选八</option>
                    <option value="7">选七</option>
                    <option value="6">选六</option>
                    <option value="5">选五</option>
                    <option value="4">选四</option>
                    <option value="3">选三</option>
                    <option value="2">选二</option>
                    <option value="1">选一</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- 左侧：操作区域 -->
        <div class="lg:col-span-2 space-y-4">

            <!-- 模式切换 Tabs -->
            <div class="flex bg-white rounded-lg p-1 shadow-sm border border-gray-200">
                <button onclick="switchTab('manual')" id="tab-manual"
                    class="flex-1 py-2 text-sm font-bold rounded-md bg-red-50 text-red-600 transition-colors">手动选号</button>
                <button onclick="switchTab('random')" id="tab-random"
                    class="flex-1 py-2 text-sm font-bold rounded-md text-gray-500 hover:text-gray-700 transition-colors">机选号码</button>
            </div>

            <!-- ================= 手动选号面板 ================= -->
            <div id="panel-manual" class="bg-white p-4 sm:p-6 rounded-lg shadow-sm border border-gray-200 fade-in">

                <div class="flex flex-wrap items-center gap-4 mb-4">
                    <label class="font-bold text-gray-700 text-sm">投注方式：</label>
                    <div class="flex gap-4 text-sm">
                        <label class="flex items-center gap-1 cursor-pointer">
                            <input type="radio" name="mode" value="single" checked
                                class="text-red-600 focus:ring-red-500 w-4 h-4"> 单/复式
                        </label>
                        <label class="flex items-center gap-1 cursor-pointer">
                            <input type="radio" name="mode" value="dantuo"
                                class="text-red-600 focus:ring-red-500 w-4 h-4"> 胆拖
                        </label>
                    </div>
                </div>

                <!-- 胆拖控制台 -->
                <div id="dantuoControls"
                    class="hidden mb-4 p-3 bg-green-50 rounded-lg border border-green-200 flex-col sm:flex-row items-start sm:items-center justify-between gap-2 text-sm">
                    <span class="text-green-800 font-medium">当前操作：</span>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-1 cursor-pointer font-bold text-green-600">
                            <input type="radio" name="dtType" value="banker" checked
                                class="text-green-500 focus:ring-green-500 w-4 h-4"> 设胆码 (必出)
                        </label>
                        <label class="flex items-center gap-1 cursor-pointer font-bold text-red-500">
                            <input type="radio" name="dtType" value="player"
                                class="text-red-500 focus:ring-red-500 w-4 h-4"> 设拖码
                        </label>
                    </div>
                </div>

                <div class="text-xs sm:text-sm text-gray-500 mb-4 bg-gray-50 p-2 rounded" id="instructionText">请选择号码。
                </div>

                <!-- 号码盘 1-80 -->
                <div class="flex justify-center">
                    <div id="numberGrid" class="grid grid-cols-10 gap-1.5 sm:gap-2 mb-2 w-full max-w-[500px]">
                        <!-- JS动态生成 -->
                    </div>
                </div>

                <div class="mt-4 flex justify-end lg:hidden">
                    <button id="btnClearMobile"
                        class="text-sm text-gray-500 border border-gray-300 px-3 py-1.5 rounded active:bg-gray-100">清空选号</button>
                </div>
            </div>

            <!-- ================= 机选号码面板 ================= -->
            <div id="panel-random"
                class="hidden bg-white p-4 sm:p-6 rounded-lg shadow-sm border border-gray-200 fade-in">
                <div class="flex flex-col sm:flex-row gap-4 items-end mb-6">
                    <div class="w-full sm:w-auto">
                        <label class="block font-bold text-gray-700 text-sm mb-2">生成注数：</label>
                        <select id="randomCount"
                            class="w-full sm:w-32 border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                            <option value="1">1 注</option>
                            <option value="5" selected>5 注</option>
                            <option value="10">10 注</option>
                        </select>
                    </div>
                    <button id="btnGenerate"
                        class="w-full sm:w-auto bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-6 rounded-md shadow-md transition-all active:scale-95 text-sm">
                        立即机选
                    </button>
                </div>

                <!-- 机选结果展示 -->
                <div class="bg-gray-50 rounded-lg border border-gray-200 p-4 min-h-[200px]">
                    <div class="flex justify-between items-center border-b pb-2 mb-3">
                        <h4 class="text-sm font-bold text-gray-500">机选结果 <span id="randomTotalInfo"
                                class="text-red-500 ml-2"></span></h4>
                        <button id="btnCopyRandom"
                            class="text-xs bg-white border border-gray-300 text-gray-700 px-3 py-1 rounded hover:bg-gray-100 hidden">
                            复制机选
                        </button>
                    </div>
                    <ul id="randomResultList" class="space-y-3">
                        <li class="text-center text-gray-400 text-sm py-10">点击上方按钮生成号码</li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 右侧：动态规则说明 -->
        <div class="space-y-4">
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                <h3 class="text-base font-bold text-gray-800 border-b pb-2 mb-3">快乐8 简介</h3>
                <p class="text-xs text-gray-600 leading-relaxed">
                    从 1 至 80 中选择一至十个号码投注，每期开出 <strong>20</strong> 个开奖号码。<br>
                    全对有大奖，不中也有奖（选七/八/九/十）。单注金额 2 元。
                </p>
            </div>

            <!-- 动态奖金表 -->
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200 border-t-4 border-t-red-500 fade-in">
                <h3 class="text-base font-bold text-gray-800 pb-2 mb-2 flex justify-between items-center">
                    <span>中奖规则</span>
                    <span id="ruleTitle" class="text-red-500 text-sm bg-red-50 px-2 py-1 rounded">选十 玩法</span>
                </h3>
                <table class="w-full text-sm text-left text-gray-600">
                    <thead class="bg-gray-50 text-gray-700">
                        <tr>
                            <th class="py-2 px-2 rounded-tl-md">中奖条件</th>
                            <th class="py-2 px-2 text-right rounded-tr-md">单注奖金</th>
                        </tr>
                    </thead>
                    <tbody id="prizeTableBody" class="divide-y divide-gray-100">
                        <!-- JS 动态填入 -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- 底部悬浮结算栏 (手动选号用) -->
    <div id="bottomBar"
        class="fixed bottom-0 left-0 w-full bg-white border-t shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40 transition-transform duration-300">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <button id="btnClearDesktop"
                class="hidden lg:block text-sm text-gray-500 border border-gray-300 px-4 py-2 rounded hover:bg-gray-50 transition">清空选号</button>
            <div class="text-xs text-gray-500 lg:hidden">
                请核对金额
            </div>
            <div class="text-right flex items-center gap-4">
                <div>
                    <span class="text-gray-800 text-sm">共 <span id="betCount"
                            class="text-red-600 font-bold text-xl px-1">0</span> 注</span>
                    <span class="text-gray-800 text-sm ml-2">金额：<span id="betCost"
                            class="text-red-600 font-bold text-xl px-1">0</span> 元</span>
                </div>
                <button id="btnCopyManual"
                    class="bg-red-500 text-white px-5 py-2 rounded font-bold shadow-md hover:bg-red-600 active:scale-95 transition-all text-sm flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                        </path>
                    </svg>
                    复制选号
                </button>
            </div>
        </div>
    </div>

    <script>
        // ----------------- 数据：各玩法奖金规则 -----------------
        const prizeData = {
            10: [{ match: '中10', prize: '最高500万' }, { match: '中9', prize: '8000元' }, { match: '中8', prize: '800元' }, { match: '中7', prize: '80元' }, { match: '中6', prize: '5元' }, { match: '中5', prize: '3元' }, { match: '全不中', prize: '2元' }],
            9: [{ match: '中9', prize: '30万元' }, { match: '中8', prize: '2000元' }, { match: '中7', prize: '200元' }, { match: '中6', prize: '20元' }, { match: '中5', prize: '5元' }, { match: '中4', prize: '3元' }, { match: '全不中', prize: '2元' }],
            8: [{ match: '中8', prize: '5万元' }, { match: '中7', prize: '800元' }, { match: '中6', prize: '88元' }, { match: '中5', prize: '10元' }, { match: '中4', prize: '3元' }, { match: '全不中', prize: '2元' }],
            7: [{ match: '中7', prize: '1万元' }, { match: '中6', prize: '288元' }, { match: '中5', prize: '28元' }, { match: '中4', prize: '4元' }, { match: '全不中', prize: '2元' }],
            6: [{ match: '中6', prize: '3000元' }, { match: '中5', prize: '30元' }, { match: '中4', prize: '10元' }, { match: '中3', prize: '3元' }],
            5: [{ match: '中5', prize: '1000元' }, { match: '中4', prize: '21元' }, { match: '中3', prize: '3元' }],
            4: [{ match: '中4', prize: '100元' }, { match: '中3', prize: '3元' }, { match: '中2', prize: '2元' }],
            3: [{ match: '中3', prize: '53元' }, { match: '中2', prize: '2元' }],
            2: [{ match: '中2', prize: '19元' }],
            1: [{ match: '中1', prize: '4.6元' }]
        };

        // ----------------- DOM 与 状态 -----------------
        const playTypeSelect = document.getElementById('playType');
        const modeRadios = document.getElementsByName('mode');
        const dtRadios = document.getElementsByName('dtType');
        const numberGrid = document.getElementById('numberGrid');
        const prizeTableBody = document.getElementById('prizeTableBody');

        let selectedNumbers = [];
        let bankerNumbers = [];
        let currentRandomResults = []; // 用于存储机选数组方便复制
        let currentBets = 0;

        // ----------------- 通用功能：Toast & 复制 -----------------
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = message;
            toast.classList.remove('opacity-0', 'toast-leave');
            toast.classList.add('toast-enter');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-leave');
            }, 2000);
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showToast('已成功复制到剪贴板！'));
            } else {
                // 兼容老版本浏览器
                let textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('已成功复制到剪贴板！');
                } catch (err) {
                    alert('复制失败，请手动选择复制');
                }
                textArea.remove();
            }
        }

        // 格式化数字 (如 5 -> '05')
        const fmt = (num) => num < 10 ? '0' + num : num.toString();

        // ----------------- 界面与逻辑 -----------------
        function getCombinations(n, m) {
            if (m > n || m < 0) return 0;
            if (m === 0 || m === n) return 1;
            if (m > n / 2) m = n - m;
            let c = 1;
            for (let i = 1; i <= m; i++) c = c * (n - i + 1) / i;
            return c;
        }

        function updatePrizeTable(playType) {
            document.getElementById('ruleTitle').innerText = `选${playType} 玩法`;
            prizeTableBody.innerHTML = '';
            prizeData[playType].forEach((rule, index) => {
                let row = document.createElement('tr');
                row.className = 'hover:bg-red-50 transition-colors fade-in';
                row.style.animationDelay = `${index * 50}ms`;
                row.innerHTML = `<td class="py-2 px-2 font-medium ${index === 0 ? 'text-red-600' : ''}">${rule.match}</td>
                                 <td class="py-2 px-2 text-right ${index === 0 ? 'font-bold text-red-600' : ''}">${rule.prize}</td>`;
                prizeTableBody.appendChild(row);
            });
        }

        window.switchTab = function (tab) {
            const manualBtn = document.getElementById('tab-manual');
            const randomBtn = document.getElementById('tab-random');
            if (tab === 'manual') {
                manualBtn.classList.replace('text-gray-500', 'text-red-600'); manualBtn.classList.add('bg-red-50');
                randomBtn.classList.replace('text-red-600', 'text-gray-500'); randomBtn.classList.remove('bg-red-50');
                document.getElementById('panel-manual').classList.remove('hidden');
                document.getElementById('panel-random').classList.add('hidden');
                document.getElementById('bottomBar').style.transform = 'translateY(0)';
            } else {
                randomBtn.classList.replace('text-gray-500', 'text-red-600'); randomBtn.classList.add('bg-red-50');
                manualBtn.classList.replace('text-red-600', 'text-gray-500'); manualBtn.classList.remove('bg-red-50');
                document.getElementById('panel-random').classList.remove('hidden');
                document.getElementById('panel-manual').classList.add('hidden');
                document.getElementById('bottomBar').style.transform = 'translateY(100%)';
            }
        }

        function initGrid() {
            numberGrid.innerHTML = '';
            for (let i = 1; i <= 80; i++) {
                let btn = document.createElement('button');
                btn.className = 'ball w-7 h-7 sm:w-9 sm:h-9 text-xs sm:text-sm rounded-full border border-gray-300 font-semibold text-gray-700 hover:bg-red-50 focus:outline-none flex items-center justify-center bg-white';
                btn.innerText = fmt(i);
                btn.onclick = () => handleNumberClick(i, btn);
                numberGrid.appendChild(btn);
            }
        }

        function getCurrentSettings() {
            let mode = 'single';
            modeRadios.forEach(r => { if (r.checked) mode = r.value; });
            let dtType = 'banker';
            dtRadios.forEach(r => { if (r.checked) dtType = r.value; });
            return { playType: parseInt(playTypeSelect.value), mode, dtType };
        }

        function handleNumberClick(num, btn) {
            const s = getCurrentSettings();
            const N = s.playType;
            btn.classList.remove('ball-pop'); void btn.offsetWidth; // trigger reflow

            if (s.mode === 'single') {
                if (selectedNumbers.includes(num)) {
                    selectedNumbers = selectedNumbers.filter(n => n !== num);
                    btn.classList.remove('selected');
                } else {
                    let max = N + 10; // 单/复式合并，最大允许多选10个
                    if (selectedNumbers.length >= max) { alert(`最多只能选择 ${max} 个号码！`); return; }
                    selectedNumbers.push(num);
                    btn.classList.add('selected');
                }
            } else if (s.mode === 'dantuo') {
                if (bankerNumbers.includes(num)) {
                    bankerNumbers = bankerNumbers.filter(n => n !== num); btn.classList.remove('banker');
                } else if (selectedNumbers.includes(num)) {
                    selectedNumbers = selectedNumbers.filter(n => n !== num); btn.classList.remove('selected');
                } else {
                    if (s.dtType === 'banker') {
                        if (bankerNumbers.length >= N - 1) { alert(`最多设置 ${N - 1} 个胆码！`); return; }
                        bankerNumbers.push(num); btn.classList.add('banker');
                    } else {
                        if (selectedNumbers.length >= 20) { alert('拖码最多选择20个！'); return; }
                        selectedNumbers.push(num); btn.classList.add('selected');
                    }
                }
            }
            calculateBets();
        }

        function calculateBets() {
            const s = getCurrentSettings();
            const N = s.playType;
            currentBets = 0;

            if (s.mode === 'single') {
                if (selectedNumbers.length >= N) currentBets = getCombinations(selectedNumbers.length, N);
            } else if (s.mode === 'dantuo') {
                let d = bankerNumbers.length, t = selectedNumbers.length;
                if (d > 0 && d < N && (d + t) >= N) currentBets = getCombinations(t, N - d);
            }
            document.getElementById('betCount').innerText = currentBets;
            document.getElementById('betCost').innerText = currentBets * 2;
        }

        function updateInstructions() {
            const s = getCurrentSettings();
            const N = s.playType;
            const dtControls = document.getElementById('dantuoControls');

            if (s.mode === 'single') {
                document.getElementById('instructionText').innerHTML = `普通投注：请选择 <span class="text-red-500 font-bold">${N} 到 ${N + 10}</span> 个号码（超过${N}个即为复式）。`;
                dtControls.classList.add('hidden'); dtControls.classList.remove('flex');
            } else {
                document.getElementById('instructionText').innerHTML = `胆拖投注：胆码最多选 <span class="text-green-600 font-bold">${N - 1}</span> 个，总数需超过 ${N} 个。`;
                dtControls.classList.remove('hidden'); dtControls.classList.add('flex');
            }
        }

        function clearAll() {
            selectedNumbers = []; bankerNumbers = []; currentBets = 0;
            document.querySelectorAll('.ball').forEach(btn => btn.classList.remove('selected', 'banker'));
            calculateBets();
        }

        // ----------------- 生成机选 -----------------
        function generateRandom() {
            const N = parseInt(playTypeSelect.value);
            const count = parseInt(document.getElementById('randomCount').value);
            const list = document.getElementById('randomResultList');
            const btn = document.getElementById('btnGenerate');
            const btnCopy = document.getElementById('btnCopyRandom');

            list.innerHTML = '';
            document.getElementById('randomTotalInfo').innerText = `(${count}注/${count * 2}元)`;
            currentRandomResults = [];

            btn.disabled = true; btn.innerHTML = '生成中...';
            btnCopy.classList.add('hidden'); // 隐藏复制按钮

            setTimeout(() => {
                for (let i = 0; i < count; i++) {
                    let pool = Array.from({ length: 80 }, (_, k) => k + 1);
                    for (let j = pool.length - 1; j > 0; j--) {
                        const r = Math.floor(Math.random() * (j + 1));
                        [pool[j], pool[r]] = [pool[r], pool[j]];
                    }
                    let result = pool.slice(0, N).sort((a, b) => a - b);
                    currentRandomResults.push(result); // 保存供复制用

                    let li = document.createElement('li');
                    li.className = 'flex items-center gap-2 fade-in bg-white p-2 sm:p-3 rounded border border-gray-100 shadow-sm';
                    li.style.animationDelay = `${i * 80}ms`;

                    let numHtml = result.map(n => `<span class="w-6 h-6 sm:w-8 sm:h-8 flex items-center justify-center bg-red-50 text-red-600 font-bold rounded-full text-xs sm:text-sm border border-red-100">${fmt(n)}</span>`).join('');
                    li.innerHTML = `<span class="text-xs text-gray-400 w-4">${i + 1}.</span> <div class="flex flex-wrap gap-1">${numHtml}</div>`;
                    list.appendChild(li);
                }
                btn.disabled = false; btn.innerHTML = '立即机选';
                btnCopy.classList.remove('hidden'); // 显示复制按钮
            }, 100);
        }

        // ----------------- 复制逻辑 -----------------
        // 复制手动选号
        document.getElementById('btnCopyManual').addEventListener('click', () => {
            if (currentBets === 0) {
                alert('注数为 0，请先选择足够的号码！');
                return;
            }
            const s = getCurrentSettings();
            let text = `【快乐8 - 选${s.playType}】`;

            if (s.mode === 'single') {
                let isFushi = selectedNumbers.length > s.playType;
                text += `${isFushi ? '复式' : '单式'}投注\n`;
                text += `号码：${selectedNumbers.sort((a, b) => a - b).map(fmt).join(' ')}\n`;
            } else {
                text += `胆拖投注\n`;
                text += `(胆) ${bankerNumbers.sort((a, b) => a - b).map(fmt).join(' ')}\n`;
                text += `(拖) ${selectedNumbers.sort((a, b) => a - b).map(fmt).join(' ')}\n`;
            }
            text += `--------------------\n共 ${currentBets} 注，金额 ${currentBets * 2} 元`;

            copyToClipboard(text);
        });

        // 复制机选号码
        document.getElementById('btnCopyRandom').addEventListener('click', () => {
            if (currentRandomResults.length === 0) return;
            const N = playTypeSelect.value;
            let text = `【快乐8 - 选${N}】机选 ${currentRandomResults.length} 注\n`;
            text += `--------------------\n`;

            currentRandomResults.forEach((arr, idx) => {
                text += `第${idx + 1}注：${arr.map(fmt).join(' ')}\n`;
            });
            text += `--------------------\n总计金额：${currentRandomResults.length * 2} 元`;

            copyToClipboard(text);
        });

        // ----------------- 事件注册 -----------------
        playTypeSelect.addEventListener('change', (e) => {
            clearAll(); updateInstructions(); updatePrizeTable(e.target.value);
            document.getElementById('randomResultList').innerHTML = '<li class="text-center text-gray-400 text-sm py-10">已切换玩法，请重新生成号码</li>';
            document.getElementById('randomTotalInfo').innerText = '';
            document.getElementById('btnCopyRandom').classList.add('hidden');
        });

        modeRadios.forEach(r => r.addEventListener('change', () => { clearAll(); updateInstructions(); }));
        document.getElementById('btnClearDesktop').addEventListener('click', clearAll);
        document.getElementById('btnClearMobile').addEventListener('click', clearAll);
        document.getElementById('btnGenerate').addEventListener('click', generateRandom);

        // Init
        initGrid(); updateInstructions(); updatePrizeTable(10);

    </script>
</body>

</html>
