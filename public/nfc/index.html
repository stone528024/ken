<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>打开 App - 智能护牙助手</title>

  <!-- Typography: Sophisticated Playfair for headings, clean Lato for body -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary: #2D5B7A;
      --accent: #6DB3BF;
      --bg: #F8FAFC;
      --text: #334155;
      --glass: rgba(255, 255, 255, 0.75);
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Lato", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      /* Sophisticated mesh-like gradient background */
      background-image:
        radial-gradient(at 0% 0%, hsla(199, 45%, 93%, 1) 0, transparent 50%),
        radial-gradient(at 50% 0%, hsla(187, 41%, 94%, 1) 0, transparent 50%),
        radial-gradient(at 100% 0%, hsla(199, 45%, 93%, 1) 0, transparent 50%);
    }

    .container {
      max-width: 380px;
      width: 88%;
      max-height: 90dvh;
      padding: 40px 24px;
      background: var(--glass);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 35px;
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
      animation: springIn 0.8s cubic-bezier(0.5, 1.2, 0.5, 1.2);
    }

    @keyframes springIn {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .logo-wrapper {
      margin-bottom: 25px;
      position: relative;
      display: inline-block;
    }

    .logo-wrapper::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      opacity: 0.3;
    }

    .logo {
      width: 75px;
      height: auto;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.08));
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-8px) rotate(2deg);
      }
    }

    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      color: var(--primary);
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .description {
      font-size: 15px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 35px;
      font-weight: 400;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      padding: 16px 20px;
      border-radius: 18px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 8px 16px rgba(45, 91, 122, 0.15);
      border: none;
    }

    .btn-primary:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.5);
      color: var(--primary);
      border: 1px solid rgba(45, 91, 122, 0.1);
    }

    .btn-secondary:active {
      background: rgba(45, 91, 122, 0.05);
      transform: scale(0.98);
    }

    .footer-note {
      margin-top: 40px;
      font-size: 10px;
      color: #94a3b8;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
    }

    @media (max-width: 480px) {
      .container {
        width: 90%;
        padding: 35px 20px;
      }

      h2 {
        font-size: 22px;
      }

      .logo {
        width: 65px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="logo-wrapper">
      <img src="./tooth.png" alt="App Logo" class="logo" />
    </div>

    <h2>请打开 App 查看内容</h2>

    <p class="description">
      如果未安装，请先下载 App。
    </p>

    <div class="actions">
      <!-- Trying to open the app via custom scheme -->
      <a href="myapp://nfc?id=666" class="btn btn-primary" id="openApp">
        立即打开 App
      </a>

      <!-- Fallback download button -->
      <a href="你的AppStore地址" class="btn btn-secondary">
        下载 App
      </a>
    </div>

    <p class="footer-note">平行世界 &middot; 即刻抵达</p>
  </div>
