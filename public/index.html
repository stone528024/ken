<!DOCTYPE html>
<html lang="zh-CN" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 神经元矩阵 | NEXUS AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { orbitron: ['Orbitron', 'sans-serif'], sans: ['Noto Sans SC', 'sans-serif'], },
                    colors: { cyber: { blue: '#00f3ff', purple: '#b53cff', dark: '#0a0a0f' } }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(181, 60, 255, 0.08), transparent 25%);
            background-attachment: fixed;
            color: #fff;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(15, 15, 25, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 243, 255, 0.05);
        }

        .nav-item {
            transition: all 0.3s ease;
        }

        .nav-item.active {
            background-color: rgba(0, 243, 255, 0.1);
            color: #00f3ff;
            border-color: rgba(0, 243, 255, 0.3);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .nav-item:not(.active):hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="flex h-screen antialiased">

    <!-- 侧边栏菜单 -->
    <aside class="w-64 glass-panel border-r border-cyber-blue/20 flex flex-col hidden md:flex">
        <div class="p-6 flex items-center gap-3 border-b border-cyber-blue/20">
            <i class="fa-solid fa-microchip text-2xl text-cyber-blue"></i>
            <h1
                class="font-orbitron font-bold text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyber-blue to-cyber-purple">
                NEXUS AI</h1>
        </div>
        <nav class="flex-1 p-4 space-y-3">
            <a href="#" onclick="switchTab('translate.html', this)"
                class="nav-item active flex items-center gap-3 p-3 rounded-lg border border-transparent text-gray-300">
                <i class="fa-solid fa-language text-lg w-5 text-center"></i>
                <span class="font-bold">文档翻译</span>
            </a>

            <a href="#" onclick="switchTab('image_convert.html', this)"
                class="nav-item flex items-center gap-3 p-3 rounded-lg border border-transparent text-gray-300">
                <i class="fa-solid fa-image text-lg w-5 text-center"></i>
                <span class="font-bold">图片处理</span>
            </a>
            <a href="#" onclick="switchTab('price.html', this)"
                class="nav-item flex items-center gap-3 p-3 rounded-lg border border-transparent text-gray-300">
                <i class="fa-solid fa-money-bill text-lg w-5 text-center"></i>
                <span class="font-bold">金额换算</span>
            </a>
            <a href="#" onclick="switchTab('gold.html', this)"
                class="nav-item flex items-center gap-3 p-3 rounded-lg border border-transparent text-gray-300">
                <i class="fa-solid fa-globe text-lg w-5 text-center"></i>
                <span class="font-bold">贵金属行情</span>
            </a>
        </nav>
        <div class="p-4 border-t border-cyber-blue/20 text-xs text-gray-500 font-orbitron text-center">
            SYS.STATUS: <span class="text-green-400">ONLINE</span><br>NODE.JS SERVER ACTIVE
        </div>
    </aside>

    <!-- 主内容区：使用 iframe 承载不同模块 -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        <iframe id="mainFrame" name="mainFrame" src="translate.html" class="w-full h-full border-none"
            title="Main Content"></iframe>
    </main>

    <script>
        function switchTab(url, element) {
            // 移除所有nav-item的active类
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active');
            });
            // 为当前点击的元素添加active类
            element.classList.add('active');

            // 切换iframe的内容
            document.getElementById('mainFrame').src = url;

            // 如果是移动端，可能还需要在这里添加隐藏侧边栏的逻辑
        }
    </script>
</body>

</html>
