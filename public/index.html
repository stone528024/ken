<!DOCTYPE html>
<html lang="zh-CN" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 神经元矩阵 | 文档翻译中枢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { orbitron: ['Orbitron', 'sans-serif'], sans: ['Noto Sans SC', 'sans-serif'], },
                    colors: { cyber: { blue: '#00f3ff', purple: '#b53cff', dark: '#0a0a0f' } }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(181, 60, 255, 0.08), transparent 25%);
            background-attachment: fixed;
            color: #fff;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(15, 15, 25, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 243, 255, 0.05);
        }

        .drop-zone {
            transition: all 0.3s ease;
        }

        .drop-zone.active {
            border-color: #00f3ff;
            background-color: rgba(0, 243, 255, 0.05);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #00f3ff;
            box-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
            animation: scan 2s linear infinite;
            display: none;
        }

        @keyframes scan {
            0% {
                top: 0;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        .terminal-log::-webkit-scrollbar {
            width: 4px;
        }

        .terminal-log::-webkit-scrollbar-thumb {
            background: #b53cff;
            border-radius: 4px;
        }
    </style>
</head>

<body class="flex h-screen antialiased">

    <aside class="w-64 glass-panel border-r border-cyber-blue/20 flex flex-col hidden md:flex">
        <div class="p-6 flex items-center gap-3 border-b border-cyber-blue/20">
            <i class="fa-solid fa-microchip text-2xl text-cyber-blue"></i>
            <h1
                class="font-orbitron font-bold text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyber-blue to-cyber-purple">
                NEXUS AI</h1>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#"
                class="flex items-center gap-3 p-3 rounded-lg bg-cyber-blue/10 text-cyber-blue border border-cyber-blue/30"><i
                    class="fa-solid fa-language"></i><span class="font-bold">文档翻译</span></a>
        </nav>
        <div class="p-4 border-t border-cyber-blue/20 text-xs text-gray-500 font-orbitron text-center">
            SYS.STATUS: <span class="text-green-400">ONLINE</span><br>NODE.JS SERVER ACTIVE
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative overflow-hidden">
        <header class="h-20 glass-panel border-b border-cyber-blue/20 flex items-center justify-between px-8 z-10">
            <h2 class="text-2xl font-orbitron font-bold">Document <span class="text-cyber-purple">Translator</span></h2>
            <div class="flex items-center gap-4">
                <select id="targetLanguage"
                    class="bg-black/50 border border-cyber-blue/30 text-cyber-blue rounded px-3 py-1.5 outline-none font-bold">
                    <option value="zh-CN">简体中文 (Chinese)</option>
                    <option value="en">English (英语)</option>
                    <option value="ja">日本語 (Japanese)</option>
                </select>
            </div>
        </header>

        <div class="flex-1 p-8 flex flex-col lg:flex-row gap-8 overflow-y-auto z-10">
            <!-- 左侧 -->
            <div class="flex-1 flex flex-col gap-6">
                <div id="dropZone"
                    class="drop-zone flex-1 glass-panel rounded-2xl border-2 border-dashed border-gray-600 flex flex-col items-center justify-center relative cursor-pointer group hover:border-cyber-blue/60 overflow-hidden">
                    <input type="file" id="fileInput" class="hidden" accept=".doc,.docx,.pdf,.txt" />
                    <div id="scanLine" class="scan-line"></div>

                    <div id="uploadUI" class="text-center">
                        <i
                            class="fa-solid fa-cloud-arrow-up text-6xl text-gray-500 group-hover:text-cyber-blue transition-colors mb-4"></i>
                        <h3 class="text-xl font-bold mb-2">拖拽文件至此 或 点击上传</h3>
                        <p class="text-gray-400 text-sm">支持格式: PDF, DOCX, DOC, TXT</p>
                    </div>

                    <div id="fileInfoUI" class="hidden text-center flex flex-col items-center">
                        <i class="fa-solid fa-file-lines text-6xl text-cyber-blue mb-4"></i>
                        <h3 id="fileName" class="text-xl font-bold text-white mb-1"></h3>
                        <p id="fileSize" class="text-cyber-purple text-sm mb-4 font-orbitron"></p>
                        <button id="resetBtn"
                            class="px-4 py-1 rounded-full border border-red-500/50 text-red-400 text-sm">移除</button>
                    </div>
                </div>

                <button id="startBtn"
                    class="w-full py-4 rounded-xl font-bold text-lg bg-gradient-to-r from-cyber-blue/20 to-cyber-purple/20 border border-cyber-blue/50 text-cyber-blue hover:from-cyber-blue hover:to-cyber-purple hover:text-black transition-all disabled:opacity-50 disabled:cursor-not-allowed font-orbitron"
                    disabled>
                    <i class="fa-solid fa-bolt mr-2"></i> Start Translation
                </button>
            </div>

            <!-- 右侧 -->
            <div class="flex-1 flex flex-col gap-6">
                <div class="flex-1 glass-panel rounded-2xl p-6 flex flex-col">
                    <div class="flex items-center justify-between mb-4 border-b border-gray-700 pb-2">
                        <h3 class="font-orbitron text-cyber-purple font-bold"><i class="fa-solid fa-terminal mr-2"></i>
                            SERVER LOG</h3>
                    </div>
                    <div id="terminalLog"
                        class="terminal-log flex-1 overflow-y-auto text-sm font-mono text-green-400 space-y-2">
                        <p>> Server connected. Awaiting payload...</p>
                    </div>
                </div>

                <div id="downloadZone"
                    class="glass-panel rounded-2xl p-6 hidden flex flex-col items-center justify-center border border-green-500/30 bg-green-500/5">
                    <i class="fa-regular fa-circle-check text-5xl text-green-400 mb-4"></i>
                    <h3 class="text-xl font-bold mb-2">翻译处理完成</h3>
                    <p class="text-gray-400 text-sm mb-6">真实文件格式已生成，完美无乱码</p>
                    <a id="downloadLink" href="#"
                        class="px-8 py-3 rounded-lg bg-green-500 text-black font-bold hover:bg-green-400 transition-all">
                        <i class="fa-solid fa-download"></i> 立即下载
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        const BACKEND_URL = 'http://localhost:3000';
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadUI = document.getElementById('uploadUI');
        const fileInfoUI = document.getElementById('fileInfoUI');
        const startBtn = document.getElementById('startBtn');
        const terminalLog = document.getElementById('terminalLog');
        const scanLine = document.getElementById('scanLine');
        let currentFile = null;

        function logToTerminal(msg, type = 'info') {
            const p = document.createElement('p');
            p.className = type === 'error' ? 'text-red-400' : type === 'warn' ? 'text-yellow-400' : 'text-green-400';
            p.innerHTML = `<span class="text-gray-500">[${new Date().toLocaleTimeString()}]</span> > ${msg}`;
            terminalLog.appendChild(p);
            terminalLog.scrollTop = terminalLog.scrollHeight;
        }

        dropZone.onclick = (e) => { if (e.target.id !== 'resetBtn') fileInput.click(); };
        fileInput.onchange = (e) => {
            currentFile = e.target.files[0];
            document.getElementById('fileName').textContent = currentFile.name;
            document.getElementById('fileSize').textContent = (currentFile.size / 1024 / 1024).toFixed(2) + ' MB';
            uploadUI.classList.add('hidden'); fileInfoUI.classList.remove('hidden');
            startBtn.disabled = false;
            logToTerminal(`File mounted: ${currentFile.name}`);
        };

        document.getElementById('resetBtn').onclick = (e) => {
            e.stopPropagation(); currentFile = null; fileInput.value = '';
            uploadUI.classList.remove('hidden'); fileInfoUI.classList.add('hidden');
            startBtn.disabled = true; document.getElementById('downloadZone').classList.add('hidden');
        };

        startBtn.onclick = async () => {
            if (!currentFile) return;
            startBtn.disabled = true;
            scanLine.style.display = 'block';
            logToTerminal(`Transmitting file to Node.js Engine...`, 'warn');

            const formData = new FormData();
            formData.append('file', currentFile);
            formData.append('targetLanguage', document.getElementById('targetLanguage').value);

            try {
                // 将文件和参数发送给 Node.js 后端
                const response = await fetch(`${BACKEND_URL}/api/translate`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error(await response.text());

                logToTerminal('Translation complete. Downloading generated file...', 'highlight');

                // 接收后端生成的真实文件 Blob
                const blob = await response.blob();

                // 从请求头获取后端生成的新文件名
                const disposition = response.headers.get('Content-Disposition');
                let filename = currentFile.name.replace(/\.[^/.]+$/, "") + "_Translated" + currentFile.name.substring(currentFile.name.lastIndexOf('.'));
                if (disposition && disposition.indexOf('filename=') !== -1) {
                    const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                    const matches = filenameRegex.exec(disposition);
                    if (matches != null && matches[1]) {
                        filename = decodeURIComponent(matches[1].replace(/['"]/g, ''));
                    }
                }

                const url = window.URL.createObjectURL(blob);
                const a = document.getElementById('downloadLink');
                a.href = url;
                a.download = filename;

                scanLine.style.display = 'none';
                document.getElementById('downloadZone').classList.remove('hidden');
                logToTerminal('Task fully completed. System standby.');

            } catch (err) {
                logToTerminal(`ERROR: ${err.message}`, 'error');
                scanLine.style.display = 'none';
            } finally {
                startBtn.disabled = false;
            }
        };
    </script>
</body>

</html>
